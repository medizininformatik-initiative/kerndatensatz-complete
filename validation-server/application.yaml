spring:
  datasource:
    url: jdbc:h2:file:/app/data/hapi;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
  jpa:
    properties:
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect
      hibernate.search.enabled: false

hapi:
  fhir:
    fhir_version: R4
    narrative_enabled: false
    install_transitive_ig_dependencies: true
    implementationguides:
      base:
        name: de.medizininformatikinitiative.kerndatensatz.base
        version: 2027.0.0-ballot.rc1
      meta:
        name: de.medizininformatikinitiative.kerndatensatz.meta
        version: 2027.0.0-ballot.rc3
      medikation:
        name: de.medizininformatikinitiative.kerndatensatz.medikation
        version: 2026.0.1
      labor:
        name: de.medizininformatikinitiative.kerndatensatz.laborbefund
        version: 2026.0.3
      biobank:
        name: de.medizininformatikinitiative.kerndatensatz.biobank
        version: 2027.0.0-ballot.rc2
      icu:
        name: de.medizininformatikinitiative.kerndatensatz.icu
        version: 2027.0.0
      mikrobiologie:
        name: de.medizininformatikinitiative.kerndatensatz.mikrobiologie
        version: 2027.0.0-alpha.5
      molgen:
        name: de.medizininformatikinitiative.kerndatensatz.molgen
        version: 2026.0.4
      patho:
        name: de.medizininformatikinitiative.kerndatensatz.patho
        version: 2026.0.2
      studie:
        name: de.medizininformatikinitiative.kerndatensatz.studie
        version: 2027.0.0-ballot.rc1
      bildgebung:
        name: de.medizininformatikinitiative.kerndatensatz.bildgebung
        version: 2027.0.0-ballot.rc2
      dokument:
        name: de.medizininformatikinitiative.kerndatensatz.dokument
        version: 2027.0.0-ballot.rc1
      onkologie:
        name: de.medizininformatikinitiative.kerndatensatz.onkologie
        version: 2026.0.3
      seltene:
        name: de.medizininformatikinitiative.kerndatensatz.seltene
        version: 2026.0.1
      mtb:
        name: de.medizininformatikinitiative.kerndatensatz.mtb
        version: 2026.0.1
      pros:
        name: de.medizininformatikinitiative.kerndatensatz.pros
        version: 2026.7.0
      kardiologie:
        name: de.medizininformatikinitiative.kerndatensatz.kardiologie
        version: 2027.0.0-ballot.rc1
      lungenfunktion:
        name: de.medizininformatikinitiative.kerndatensatz.lungenfunktion
        version: 2027.0.0-ballot.rc1
      # soziodemographie: Package noch nicht publiziert (mii-kds-complete-e1x)
      basisprofil:
        name: de.basisprofil.r4
        version: 1.6.0

      # Externe Abhaengigkeiten, explizit gepinnt (siehe package.json / sushi-config.yaml).
      # install_transitive_ig_dependencies wuerde sie ohnehin nachziehen, aber ohne
      # definierte Version -- bei Uneinigkeit zwischen den Modulen ist das nicht deterministisch.
      terminology:
        name: hl7.terminology.r4
        version: 7.3.0
      extensions:
        name: hl7.fhir.uv.extensions.r4
        version: 5.3.0
      genomics:
        name: hl7.fhir.uv.genomics-reporting
        version: 3.0.0
      eubase:
        name: hl7.fhir.eu.base
        version: 2.0.0
      eulaboratory:
        name: hl7.fhir.eu.laboratory
        version: 2.0.0
      euextensions:
        name: hl7.fhir.eu.extensions.r4
        version: 1.3.0
      miabis:
        name: eu.miabis.r4
        version: 0.2.0
      isik:
        name: de.gematik.isik
        version: 6.0.0
      # einwilligung disabled: example-ConsentManagement-Provenance.json contains
      # base64 PNG signature that crashes HAPI packageInstaller (HAPI-1821)
      # einwilligung:
      #   name: de.einwilligungsmanagement
      #   version: 1.0.2
