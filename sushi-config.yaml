id: de.medizininformatikinitiative.kerndatensatz.complete
canonical: https://www.medizininformatik-initiative.de/fhir/core/complete
name: MIIKerndatensatzComplete
title: MII Kerndatensatz Complete
description: Bill of Materials (BOM) aller Module des MII Kerndatensatzes samt gepinnter externer Abhaengigkeiten (Ballot-Stand 2027.0.0)
status: active
version: 2027.0.0-ballot.19
fhirVersion: 4.0.1
copyrightYear: 2025+
releaseLabel: ballot
license: CC-BY-4.0
jurisdiction: urn:iso:std:iso:3166#DE "Germany"
publisher:
  name: Medizininformatik Initiative
  url: https://www.medizininformatik-initiative.de

# The dependencies property corresponds to IG.dependsOn. The key is the
# package id and the value is the version (or dev/current). For advanced
# use cases, the value can be an object with keys for id, uri, and version.
#
# Ballot-Stand 2026-09-21: Die 2027er Linie ist vollstaendig kohaerent.
# icu 2027.0.0-ballot.3 (publiziert 2026-09-17) hat die letzte Abweichung
# (icu -> base 2026.0.1) aufgeloest; deklariert jetzt base/meta 2027.0.0-ballot,
# basisprofil 1.6.0, isik 6.0.0, terminology 7.3.0, dvmd.kdl.r4 2026.0.0.
#
# icu 2027.0.0 ist in ignored-versions.json ausgeschlossen: versehentlich
# publiziert, 256 statt 267 Ressourcen, ohne die fuenf Score-Profile. Ohne den
# Ausschluss wuerde sie als hoechste Version greifen, weil eine finale CalVer
# ueber jedem Ballot sortiert. Es ist ausdruecklich die Ballot-Linie zu pinnen.
#
# Erledigt seit dem letzten Stand:
#   bildgebung 2027.0.0-ballot.1  Deps umgezogen (waren base/medikation 2026.0.1,
#                                 meta 2026.0.0)
#   onkologie  2027.0.0-ballot.1  nimmt jetzt molgen 2027.0.0-ballot.1
#   mtb        2027.0.0-ballot.1  vollstaendig umgezogen; consent entfernt, weil
#                                 kein Artefakt es konsumierte
#   kardiologie                   deklariert icu nicht mehr
#   lungenfunktion                Tippfehler 'de.basiprofil.r4' behoben
#
# Der Abgleich steckt in dep-graph-2027.dot: rot gestrichelt = Abweichung.
# Knotenlabel und Kantenfarben werden aus package.json erzeugt, nicht gepflegt.
# Siehe mii-kds-complete-alr, mii-kds-complete-d3d.
dependencies:
  # Deutsche Basisprofile
  de.basisprofil.r4: 1.6.0

  # MII Kerndatensatz Basismodule
  de.medizininformatikinitiative.kerndatensatz.base: 2027.0.0-ballot
  de.medizininformatikinitiative.kerndatensatz.meta: 2027.0.0-ballot
  de.medizininformatikinitiative.kerndatensatz.medikation: 2027.0.0-ballot
  de.medizininformatikinitiative.kerndatensatz.laborbefund: 2027.0.0-ballot

  # MII Kerndatensatz Erweiterungsmodule
  de.medizininformatikinitiative.kerndatensatz.biobank: 2027.0.0-ballot
  de.medizininformatikinitiative.kerndatensatz.icu: 2027.0.0-ballot.3
  de.medizininformatikinitiative.kerndatensatz.mikrobiologie: 2027.0.0-ballot2
  de.medizininformatikinitiative.kerndatensatz.molgen: 2027.0.0-ballot.1
  de.medizininformatikinitiative.kerndatensatz.patho: 2027.0.0-ballot
  de.medizininformatikinitiative.kerndatensatz.studie: 2027.0.0-ballot
  de.medizininformatikinitiative.kerndatensatz.bildgebung: 2027.0.0-ballot.1
  de.medizininformatikinitiative.kerndatensatz.dokument: 2027.0.0-ballot.2
  de.medizininformatikinitiative.kerndatensatz.onkologie: 2027.0.0-ballot.1
  de.medizininformatikinitiative.kerndatensatz.seltene: 2027.0.0-ballot
  de.medizininformatikinitiative.kerndatensatz.mtb: 2027.0.0-ballot.1
  de.medizininformatikinitiative.kerndatensatz.pros: 2027.0.0-ballot.1
  de.medizininformatikinitiative.kerndatensatz.kardiologie: 2027.0.0-ballot
  de.medizininformatikinitiative.kerndatensatz.lungenfunktion: 2027.0.0-ballot.1
  de.medizininformatikinitiative.kerndatensatz.symptom: 2027.0.0-ballot
  de.medizininformatikinitiative.kerndatensatz.soziodemographie: 2027.0.0-ballot

  # Soziodemographie ist seit 2026-09-16 gepinnt: Package 2027.0.0-ballot liegt auf
  # Simplifier und packages.fhir.org, Deps base/meta 2027.0.0-ballot. Zuvor war es
  # bewusst ausgelassen, weil das Package in keiner Registry auffindbar war
  # (mii-kds-complete-e1x).

  # Einwilligungsmanagement
  de.medizininformatikinitiative.kerndatensatz.consent: 2027.0.0-ballot

  # Externe Abhaengigkeiten
  #
  # Gepinnt wird jeweils die hoechste Version, die ein MII-Modul transitiv tatsaechlich
  # anfordert -- nicht die neueste verfuegbare. Eine Version, gegen die kein Modul gebaut
  # wurde, gehoert nicht in eine BOM.
  #
  # Uneinigkeit zwischen den Modulen (jeweils hoechste gewinnt):
  #   hl7.terminology.r4        5.0.0 / 6.1.0 / 6.5.0 / 7.1.0 / 7.2.0 / 7.3.0 (icu 2027.0.0-ballot.3)
  #   hl7.fhir.uv.extensions.r4 5.1.0 / 5.2.0 / 5.3.0 (base 2026.0.1, crmi 2.0.0)
  #   de.gematik.isik           5.1.0 (patho) / 5.1.1 (pros) / 6.0.0 (icu, dokument)
  #
  # eu.miabis.r4 steht seit biobank 2027.0.0-ballot auf 1.3.0 -- das Modul hat den
  # Umzug auf die neuen MIABIS-Pfade (ohne /fhir/-Segment) vollzogen.

  # icu ist bewusst auf 2027.0.0-ballot.3 gepinnt und NICHT auf 2027.0.0:
  # letzteres wurde versehentlich publiziert, enthaelt 256 statt 267 Ressourcen
  # und es fehlen die fuenf Score-Profile. Siehe ignored-versions.json.

  # Terminologie
  hl7.terminology.r4: 7.3.0

  # Extensions
  hl7.fhir.uv.extensions.r4: 5.3.0

  # Clinical Genomics
  hl7.fhir.uv.genomics-reporting: 3.0.0

  # EU-Profile
  hl7.fhir.eu.base: 2.0.0
  hl7.fhir.eu.laboratory: 2.0.0
  hl7.fhir.eu.extensions.r4: 1.3.0

  # Biobank (MIABIS)
  eu.miabis.r4: 1.3.0

  # ISiK
  de.gematik.isik: 6.0.0
#
#
# The pages property corresponds to IG.definition.page. SUSHI can
# auto-generate the page list, but if the author includes pages in
# this file, it is assumed that the author will fully manage the
# pages section and SUSHI will not generate any page entries.
# The page file name is used as the key. If title is not provided,
# then the title will be generated from the file name.  If a
# generation value is not provided, it will be inferred from the
# file name extension.  Any subproperties that are valid filenames
# with supported extensions (e.g., .md/.xml) will be treated as
# sub-pages.
#
# pages:
#   index.md:
#     title: Example Home
#   implementation.xml:
#   examples.xml:
#     title: Examples Overview
#     simpleExamples.xml:
#     complexExamples.xml:
#
#
# The parameters property represents IG.definition.parameter. Rather
# than a list of code/value pairs (as in the ImplementationGuide
# resource), the code is the YAML key. If a parameter allows repeating
# values, the value in the YAML should be a sequence/array.
# For parameters defined by core FHIR see:
# http://build.fhir.org/codesystem-guide-parameter-code.html
# For parameters defined by the FHIR Tools IG see:
# http://build.fhir.org/ig/FHIR/fhir-tools-ig/branches/master/CodeSystem-ig-parameters.html
#
# parameters:
#   excludettl: true
#   validation: [allow-any-extensions, no-broken-links]
#
# ╭────────────────────────────────────────────menu.xml────────────────────────────────────────────╮
# │ The menu property will be used to generate the input/menu.xml file. The menu is represented    │
# │ as a simple structure where the YAML key is the menu item name and the value is the URL.       │
# │ The IG publisher currently only supports one level deep on sub-menus. To provide a             │
# │ custom menu.xml file, do not include this property and include a `menu.xml` file in            │
# │ input/includes. To use a provided input/includes/menu.xml file, delete the "menu"              │
# │ property below.                                                                                │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
menu:
  Home: index.html
  Artifacts: artifacts.html

# ╭───────────────────────────Less Common Implementation Guide Properties──────────────────────────╮
# │  Uncomment the properties below to configure additional properties on the ImplementationGuide  │
# │  resource. These properties are less commonly needed than those above.                         │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
#
# Those who need more control or want to add additional details to the contact values can use
# contact directly and follow the format outlined in the ImplementationGuide resource and
# ContactDetail.
#
# contact:
#   - name: Bob Smith
#     telecom:
#       - system: email # phone | fax | email | pager | url | sms | other
#         value: bobsmith@example.org
#         use: work
#
#
# The global property corresponds to the IG.global property, but it
# uses the type as the YAML key and the profile as its value. Since
# FHIR does not explicitly disallow more than one profile per type,
# neither do we; the value can be a single profile URL or an array
# of profile URLs. If a value is an id or name, SUSHI will replace
# it with the correct canonical when generating the IG JSON.
#
# global:
#   Patient: http://example.org/fhir/StructureDefinition/my-patient-profile
#   Encounter: http://example.org/fhir/StructureDefinition/my-encounter-profile
#
#
# The resources property corresponds to IG.definition.resource.
# SUSHI can auto-generate all of the resource entries based on
# the FSH definitions and/or information in any user-provided
# JSON or XML resource files. If the generated entries are not
# sufficient or complete, however, the author can add entries
# here. If the reference matches a generated entry, it will
# replace the generated entry. If it doesn't match any generated
# entries, it will be added to the generated entries. The format
# follows IG.definition.resource with the following differences:
#   * use IG.definition.resource.reference.reference as the YAML key.
#   * if the key is an id or name, SUSHI will replace it with the
#     correct URL when generating the IG JSON.
#   * specify "omit" to omit a FSH-generated resource from the
#     resource list.
#   * if the exampleCanonical is an id or name, SUSHI will replace
#     it with the correct canonical when generating the IG JSON.
#   * groupingId can be used, but top-level groups syntax may be a
#     better option (see below).
# The following are simple examples to demonstrate what this might
# look like:
#
# resources:
#   Patient/my-example-patient:
#     name: My Example Patient
#     description: An example Patient
#     exampleBoolean: true
#   Patient/bad-example: omit
#
#
# Groups can control certain aspects of the IG generation.  The IG
# documentation recommends that authors use the default groups that
# are provided by the templating framework, but if authors want to
# use their own instead, they can use the mechanism below.  This will
# create IG.definition.grouping entries and associate the individual
# resource entries with the corresponding groupIds. If a resource
# is specified by id or name, SUSHI will replace it with the correct
# URL when generating the IG JSON.
#
# groups:
#   GroupA:
#     name: Group A
#     description: The Alpha Group
#     resources:
#     - StructureDefinition/animal-patient
#     - StructureDefinition/arm-procedure
#   GroupB:
#     name: Group B
#     description: The Beta Group
#     resources:
#     - StructureDefinition/bark-control
#     - StructureDefinition/bee-sting
#
#
# The ImplementationGuide resource defines several other properties
# not represented above. These properties can be used as-is and
# should follow the format defined in ImplementationGuide:
# * date
# * meta
# * implicitRules
# * language
# * text
# * contained
# * extension
# * modifierExtension
# * experimental
# * useContext
# * copyright
# * packageId
#
#
# ╭──────────────────────────────────────────SUSHI flags───────────────────────────────────────────╮
# │  The flags below configure aspects of how SUSHI processes FSH.                                 │
# ╰────────────────────────────────────────────────────────────────────────────────────────────────╯
# The FSHOnly flag indicates if only FSH resources should be exported.
# If set to true, no IG related content will be generated.
# The default value for this property is false.
#
# FSHOnly: false
#
#
# When set to true, the "short" and "definition" field on the root element of an Extension will
# be set to the "Title" and "Description" of that Extension. Default is true.
#
# applyExtensionMetadataToRoot: true
#
#
# The instanceOptions property is used to configure certain aspects of how SUSHI processes instances.
# See the individual option definitions below for more detail.
#
instanceOptions:
  # When set to true, slices must be referred to by name and not only by a numeric index in order to be used
  # in an Instance's assignment rule. All slices appear in the order in which they are specified in FSH rules.
  # While SUSHI defaults to false for legacy reasons, manualSliceOrding is recommended for new projects.
  manualSliceOrdering: true # true | false
  # Determines for which types of Instances SUSHI will automatically set meta.profile
  # if InstanceOf references a profile:
  #
  # setMetaProfile: always # always | never | inline-only | standalone-only
  #
  #
